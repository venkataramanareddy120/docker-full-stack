<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full-Stack Docker Assignment</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #eef2ff);
    }
    .card {
      width: min(100%, 480px); padding: 30px; background: white;
      border-radius: 16px; box-shadow: 0 12px 35px #0f172a18;
    }
    h1 { margin-top: 0; color: #172554; }
    p { color: #475569; line-height: 1.5; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input, textarea {
      width: 100%; padding: 12px; border: 1px solid #cbd5e1;
      border-radius: 8px; font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      width: 100%; margin-top: 20px; padding: 13px; border: 0;
      border-radius: 8px; color: white; background: #2563eb;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result { margin-top: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Contact Form</h1>
    <p>Submit the form. The Express frontend sends your details to the Flask backend.</p>
    <form id="contact-form">
      <label for="name">Name</label>
      <input id="name" name="name" required maxlength="80" placeholder="Enter your name">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="120" placeholder="you@example.com">

      <label for="message">Message</label>
      <textarea id="message" name="message" required maxlength="1000" placeholder="Write your message"></textarea>

      <button id="submit-button" type="submit">Submit</button>
    </form>
    <p id="result" role="status"></p>
  </main>
  <script>
    const form = document.getElementById("contact-form");
    const result = document.getElementById("result");
    const button = document.getElementById("submit-button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.textContent = "Sending...";

      const formData = Object.fromEntries(new FormData(form).entries());
      try {
        const response = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formData)
        });
        const data = await response.json();
        result.textContent = data.message || "Request completed.";
        if (response.ok && data.success) form.reset();
      } catch (_error) {
        result.textContent = "Request failed. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
